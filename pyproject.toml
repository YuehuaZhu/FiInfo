[project]
name = "fiinfo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "jinja2>=3.1",
  "httpx>=0.27",
  "tenacity>=8.2",
  "anthropic>=0.40",
  "openai>=1.40",
  "pyyaml>=6.0",
  "feedparser>=6.0",
  "tweepy>=4.14",
  "apscheduler>=3.10",
  "playwright>=1.44,<1.59",
  "python-dotenv>=1.0",
  "click>=8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiinfo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

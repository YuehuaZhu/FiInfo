# FiInfo 信息渠道开关配置
# 改一行 enabled: false 即可禁用某个源,无需改代码

defaults:
  enabled: true
  cadence: daily        # daily / 4h / 1h / 5m,目前作为 metadata,实际由 scheduler 决定
  limit: 30

sources:
  # === Twitter KOL(已有 Playwright) ===
  twitter:
    enabled: true
    kind: twitter
    impl: fiinfo.sources.playwright_src:PlaywrightSignalSource
    cadence: daily
    require_env: [TWITTER_AUTH_TOKEN]
    params:
      delay_min_s: 5
      delay_max_s: 10

  # === Twitter Fixture(测试用) ===
  twitter_fixture:
    enabled: false      # 默认关,跑 make daily 时不要走 mock
    kind: twitter
    impl: fiinfo.sources.fixture:FixtureSignalSource

  # === DefiLlama TVL ===
  defillama_tvl:
    enabled: true
    kind: defillama
    impl: fiinfo.sources.defillama:TVLSource
    cadence: 4h
    params:
      top_n: 30
      min_change_pct: 3       # 24h 涨跌幅绝对值 < 3% 不收

  # === DefiLlama Raises(融资) ===
  defillama_raises:
    enabled: true
    kind: defillama
    impl: fiinfo.sources.defillama:RaisesSource
    cadence: daily
    params:
      since_days: 7

  # === DefiLlama Hacks(安全事件) ===
  defillama_hacks:
    enabled: true
    kind: defillama
    impl: fiinfo.sources.defillama:HacksSource
    cadence: daily
    params:
      since_days: 14

  # === CoinGecko Trending ===
  coingecko_trending:
    enabled: true
    kind: coingecko
    impl: fiinfo.sources.coingecko:TrendingSource
    cadence: 4h

  # === CryptoPanic 新闻聚合 ===
  cryptopanic:
    enabled: true
    kind: cryptopanic
    impl: fiinfo.sources.cryptopanic:NewsSource
    cadence: 1h
    params:
      filter: hot
      limit: 50

  # === Reddit 多 sub 热帖 ===
  reddit:
    enabled: true
    kind: reddit
    impl: fiinfo.sources.reddit:HotPostsSource
    cadence: 4h
    params:
      subs: [CryptoCurrency, ethfinance, solana, defi]
      limit_per_sub: 15

  # === Snapshot 治理提案 ===
  snapshot:
    enabled: true
    kind: snapshot
    impl: fiinfo.sources.snapshot:ProposalsSource
    cadence: 4h
    params:
      spaces:
        - uniswapgovernance.eth
        - aavedao.eth
        - lido-snapshot.eth
        - opcollective.eth
        - ens.eth
        - arbitrumfoundation.eth
        - balancer.eth
        - gitcoindao.eth

  # === GitHub Trending(每日) ===
  github_trending:
    enabled: true
    kind: github
    impl: fiinfo.sources.github_trending:TrendingSource
    cadence: daily

  # === 中文 RSS ===
  rss_zh:
    enabled: true
    kind: rss
    impl: fiinfo.sources.rss_feeds:RSSSource
    cadence: 1h
    params:
      feeds:
        - https://foresightnews.pro/feed
        - https://www.chaincatcher.com/feed.xml
        - https://www.odaily.news/feed

  # === 英文 RSS ===
  rss_en:
    enabled: true
    kind: rss
    impl: fiinfo.sources.rss_feeds:RSSSource
    cadence: 1h
    params:
      feeds:
        - https://www.theblock.co/rss.xml
        - https://cointelegraph.com/rss

  # === TokenUnlocks ===
  tokenunlocks:
    enabled: false      # 第三方 API 不稳定,先关
    kind: tokenunlocks
    impl: fiinfo.sources.tokenunlocks:UnlocksSource
    cadence: daily

  # === Etherscan 大额转账(可选) ===
  etherscan_whales:
    enabled: false      # 需要 ETHERSCAN_KEY 才能开
    kind: etherscan
    impl: fiinfo.sources.etherscan:WhaleTransferSource
    cadence: 1h
    require_env: [ETHERSCAN_KEY]

# === 全局开关 ===
top_stories:
  enabled: true         # 是否在 HTML 顶部生成 LLM 融合的 Top-10 stories
  count: 10
  llm: auto             # auto = 用工厂选定的(qwen/doubao/claude)

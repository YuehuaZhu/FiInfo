# FiInfo 信息渠道开关配置
# 改一行 enabled: false 即可禁用某个源,无需改代码
# 当前 Phase 9.1 只接了 Twitter,9.2-9.12 会陆续启用下面其他源

defaults:
  enabled: false        # 默认全关,显式 enabled: true 才生效
  cadence: daily
  limit: 30

sources:
  twitter:
    enabled: true       # ✅ 已实现
    kind: twitter
    impl: fiinfo.sources.playwright_src:PlaywrightSignalSource
    cadence: daily
    require_env: [TWITTER_AUTH_TOKEN]
    params:
      delay_min_s: 5
      delay_max_s: 10

  twitter_fixture:
    enabled: false      # 测试用,跑真实流程时关
    kind: twitter
    impl: fiinfo.sources.fixture:FixtureSignalSource

  # ─── 以下为 Phase 9.2-9.12 待实现源,启用前需要先写 impl 类 ───

  defillama_tvl:
    enabled: true       # ✅ Phase 9.2
    kind: defillama
    impl: fiinfo.sources.defillama:TVLSource
    cadence: 4h
    params:
      top_n: 30
      min_change_pct: 3

  defillama_raises:
    enabled: false
    kind: defillama
    impl: fiinfo.sources.defillama:RaisesSource
    cadence: daily
    params:
      since_days: 7

  defillama_hacks:
    enabled: true       # ✅ Phase 9.4
    kind: defillama
    impl: fiinfo.sources.defillama:HacksSource
    cadence: daily
    params:
      since_days: 14

  coingecko_trending:
    enabled: true       # ✅ Phase 9.5
    kind: coingecko
    impl: fiinfo.sources.coingecko:TrendingSource
    cadence: 4h

  cryptopanic:
    enabled: false      # Cloudflare 403,免费 RSS 已被关闭。需要 CRYPTOPANIC_TOKEN
    kind: cryptopanic
    impl: fiinfo.sources.cryptopanic:NewsSource
    cadence: 1h
    require_env: [CRYPTOPANIC_TOKEN]
    params:
      filter: hot
      limit: 50

  reddit:
    enabled: false      # 2024 后 Reddit JSON 限免,需要 OAuth。MORNING_TODO 提示用户提供
    kind: reddit
    impl: fiinfo.sources.reddit:HotPostsSource
    cadence: 4h
    require_env: [REDDIT_CLIENT_ID]
    params:
      subs: [CryptoCurrency, ethfinance, solana, defi]
      limit_per_sub: 15

  snapshot:
    enabled: true       # ✅ Phase 9.6
    kind: snapshot
    impl: fiinfo.sources.snapshot:ProposalsSource
    cadence: 4h
    params:
      spaces:
        - uniswapgovernance.eth
        - aavedao.eth
        - lido-snapshot.eth
        - opcollective.eth
        - ens.eth
        - arbitrumfoundation.eth
        - balancer.eth
        - gitcoindao.eth

  github_trending:
    enabled: true       # ✅ Phase 9.7
    kind: github
    impl: fiinfo.sources.github_trending:TrendingSource
    cadence: daily

  rss_zh:
    enabled: false      # 中文媒体(Foresight/Odaily/ChainCatcher)的 RSS 都已关闭,改 SPA 了
    kind: rss
    impl: fiinfo.sources.rss_feeds:RSSSource
    cadence: 1h
    params:
      feeds:
        - https://foresightnews.pro/feed
        - https://www.chaincatcher.com/feed.xml
        - https://www.odaily.news/feed

  rss_en:
    enabled: true       # ✅ Phase 9.8 (Cointelegraph + The Block)
    kind: rss
    impl: fiinfo.sources.rss_feeds:RSSSource
    cadence: 1h
    params:
      feeds:
        - https://www.theblock.co/rss.xml
        - https://cointelegraph.com/rss

  tokenunlocks:
    enabled: false
    kind: tokenunlocks
    impl: fiinfo.sources.tokenunlocks:UnlocksSource
    cadence: daily

  etherscan_whales:
    enabled: false
    kind: etherscan
    impl: fiinfo.sources.etherscan:WhaleTransferSource
    cadence: 1h
    require_env: [ETHERSCAN_KEY]

# === 全局开关 ===
top_stories:
  enabled: true
  count: 10
  llm: auto
